apis:
- name: Taker GO Integration API
  description: >-
    Delivery-integration API connecting restaurants (Taker GO merchants) and
    delivery service providers (DSPs). Supports order creation, retrieval,
    cancellation, DSP re-routing, and asynchronous order-status webhooks.
    Bearer-token authentication (TAKERGO_TOKEN for restaurants, DSP_TOKEN for
    delivery providers); JSON over HTTPS.
