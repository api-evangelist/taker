aid: taker
name: Taker
description: >-
  Taker is a Riyadh, Saudi Arabia-based restaurant technology company (founded
  2018, backed by 500 Global) providing an all-in-one online ordering and
  restaurant-growth platform used by 1,000+ restaurants. Its product suite spans
  Taker Channels (branded web/mobile ordering), Taker GO (delivery operations),
  Taker Flow (operations optimization), Taker Grow (marketing automation), and
  Taker 360 (a unified dashboard across delivery aggregators). The Taker GO
  delivery-integration API connects restaurants and delivery service providers
  (DSPs) with bearer-token auth for order creation, tracking, cancellation, and
  asynchronous status delivery via webhooks, across published sandbox and
  production environments.
